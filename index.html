<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mateo — Mi bautizo & primer añito</title>
  <meta name="description" content="Invitación digital de Mateo">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="invitation">
    <section class="hero" aria-label="Invitación de Mateo">
      <img src="invitacion-seccion-1.jpg"
           alt="Invitación de Mateo: Mi bautizo y primer añito"
           class="hero-image">

      <!-- Botón de música: reemplaza music.mp3 por tu archivo de audio -->
      <button class="music-button" id="musicButton" aria-label="Reproducir música" title="Reproducir música">
        ▶
      </button>
      <audio id="music" loop preload="none">
        <source src="music.mp3" type="audio/mpeg">
      </audio>
    </section>
  </main>

  <script>
    const button = document.getElementById('musicButton');
    const music = document.getElementById('music');

    button.addEventListener('click', async () => {
      if (music.paused) {
        try {
          await music.play();
          button.textContent = '❚❚';
          button.setAttribute('aria-label', 'Pausar música');
        } catch (e) {
          alert('Agrega un archivo llamado music.mp3 a esta carpeta para activar la música.');
        }
      } else {
        music.pause();
        button.textContent = '▶';
        button.setAttribute('aria-label', 'Reproducir música');
      }
    });
  </script>
</body>
</html>
